<style>:root{--bg:#07090d;--p:#0e1219;--b:#232c3b;--t:#e8edf4;--s:#8a96a8;--a:#ffa028;--r:#ff4d5e}
@media (prefers-color-scheme: light){:root{--bg:#eef1f5;--p:#fff;--b:#d5dbe4;--t:#141a22;--s:#5a6575;--a:#c25e00}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--t);
font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.c{width:100%;max-width:360px;background:var(--p);border:1px solid var(--b);border-radius:16px;padding:26px 22px;box-shadow:0 10px 30px #0006}
.m{display:flex;font:800 15px/1 Consolas,Menlo,monospace;letter-spacing:.06em;margin-bottom:18px}
.m b{background:var(--a);color:#000;padding:6px 8px;border-radius:6px 0 0 6px}.m span{border:1px solid var(--a);color:var(--a);padding:5px 8px;border-radius:0 6px 6px 0}
p{color:var(--s);font-size:13.5px;margin:0 0 14px}input[type=password],input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--b);
background:var(--bg);color:var(--t);font-size:16px;margin-bottom:10px}input:focus{outline:none;border-color:var(--a)}
label{display:flex;gap:8px;align-items:center;color:var(--s);font-size:13px;margin:4px 0 14px}
button{width:100%;padding:12px;border:0;border-radius:10px;font:700 15px sans-serif;background:linear-gradient(180deg,#ffb54d,#ff8a00);color:#111;cursor:pointer}
.e{color:var(--r);font-size:13px;min-height:20px;margin-top:10px}</style></head><body>

<input type="password" id="k" autocomplete="current-password" placeholder="Clave" required>

function b(s){var x=atob(s),u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}
async function hid(n){var h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('radar:'+n.trim().toLowerCase())));
return Array.from(h).map(function(x){return x.toString(16).padStart(2,'0')}).join('').slice(0,20)}
async function cekLocal(u,k){var c=crypto.subtle,sl=D.u[await hid(u)];if(!sl)return null;
var km=await c.importKey('raw',new TextEncoder().encode(k),'PBKDF2',false,['deriveBits']);
var kb=await c.deriveBits({name:'PBKDF2',salt:b(sl.s),iterations:D.i,hash:'SHA-256'},km,256);
var kw=await c.importKey('raw',kb,'AES-GCM',false,['decrypt']);
try{return await c.decrypt({name:'AES-GCM',iv:b(sl.n)},kw,b(sl.w))}catch(x){return null}}
async function cekServidor(u,k){if(!FUNC||!D.srv)return null;

var j=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(j.error||'Usuario o clave incorrectos, o acceso retirado.');return b(j.cek)}
async function abrir(u,k){var c=crypto.subtle,esAdm=(await hid(u))===ADMIN_ID;
