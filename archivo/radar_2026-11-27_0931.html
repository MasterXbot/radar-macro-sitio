slice(0,10))+'<\/td><td style=\"text-align:right;white-space:nowrap\">'\n+'<button class=\"g\" data-u=\"'+rmEsc(u.usuario)+'\" onclick=\"rmNueva(this.dataset.u)\">Nueva clave<\/button> <button class=\"g\" data-u=\"'+rmEsc(u.usuario)+'\" onclick=\"rmQuitar(this.dataset.u)\" style=\"color:#ff4d5e\">Quitar<\/button><\/td><\/tr>'}).join('')\n||'<tr><td colspan=3 class=\"s\">Todavia no hay usuarios.<\/td><\/tr>'}catch(e){L.innerHTML='<tr><td colspan=3 class=\"er\">'+rmEsc(e.message)+'<\/td><\/tr>'}}\nfunction rmMostrar(j){var t='Sitio: '+location.origin+location.pathname.replace(/archivo\\/.*$/,'')+'\\nUsuario: '+j.usuario+'\\nClave: '+j.clave;\ndocument.getElementById('rmOk').innerHTML='<div class=\"ok\">'+rmEsc(t)+'<\/div><button class=\"g\" id=\"rmCp\">Copiar datos<\/button> <span class=\"s\">Enviaselos por privado. La clave no se vuelve a mostrar.<\/span>';\ndocument.getElementById('rmCp').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(t);this.textContent='Copiado'}}\nasync function rmCrear(){var E=document.getElementById('rmE');E.textContent='';try{var j=await rmApi({op:'crear',usuario:document.getElementById('rmU').value,clave:document.getElementById('rmC').value});\nrmMostrar(j);document.getElementById('rmU').value='';document.getElementById('rmC').value='';rmListar()}catch(e){E.textContent=e.message}}\nasync function rmQuitar(u){if(!confirm('Quitar el acceso a '+u+'?'))return;try{await rmApi({op:'quitar',usuario:u});rmListar()}catch(e){document.getElementById('rmE').textContent=e.message}}\nasync function rmNueva(u){if(!confirm('Generar una clave nueva para '+u+'? La anterior deja de servir.'))return;try{rmMostrar(await rmApi({op:'clave',usuario:u}))}catch(e){document.getElementById('rmE').textContent=e.message}}\nfunction rmAbrir(){document.getElementById('rmP').style.display='flex';rmListar()}\n<\/script>";
function b(s){var x=atob(s),u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}

async function cekLocal(u,k){var c=crypto.subtle,sl=D.u[await hid(u)];if(!sl)return null;
