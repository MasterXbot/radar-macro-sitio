{if(!confirm('Quitar el acceso a '+u+'?'))return;try{await rmApi({op:'quitar',usuario:u});rmListar()}catch(e){document.getElementById('rmE').textContent=e.message}}\nasync function rmNueva(u){if(!confirm('Generar una clave nueva para '+u+'? La anterior deja de servir.'))return;try{rmMostrar(await rmApi({op:'clave',usuario:u}))}catch(e){document.getElementById('rmE').textContent=e.message}}\nfunction rmAbrir(){document.getElementById('rmP').style.display='flex';rmListar()}\n<\/script>";
function b(s){var x=atob(s),u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}
async function hid(n){var h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('radar:'+n.trim().toLowerCase())));
return Array.from(h).map(function(x){return x.toString(16).padStart(2,'0')}).join('').slice(0,20)}
async function cekLocal(u,k){var c=crypto.subtle,sl=D.u[await hid(u)];if(!sl)return null;
var km=await c.importKey('raw',new TextEncoder().encode(k),'PBKDF2',false,['deriveBits']);
var kb=await c.deriveBits({name:'PBKDF2',salt:b(sl.s),iterations:D.i,hash:'SHA-256'},km,256);
var kw=await c.importKey('raw',kb,'AES-GCM',false,['decrypt']);
try{return await c.decrypt({name:'AES-GCM',iv:b(sl.n)},kw,b(sl.w))}catch(x){return null}}
async function cekServidor(u,k){if(!FUNC||!D.srv)return null;
var r=await fetch(FUNC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({accion:'abrir',usuario:u,clave:k,srv:D.srv})});
var j=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(j.error||'Usuario o clave incorrectos, o acceso retirado.');return b(j.cek)}
async function abrir(u,k){var c=crypto.subtle,esAdm=(await hid(u))===ADMIN_ID;
var cek=await cekLocal(u,k);if(!cek&&!esAdm)cek=await cekServidor(u.trim().toLowerCase(),k);if(!cek)throw new Error('Usuario o clave incorrectos, o acceso retirado.');
var kc=await c.importKey('raw',cek,'AES-GCM',false,['decrypt']);
var t=new TextDecoder().decode(await c.decrypt({name:'AES-GCM',iv:b(D.n)},kc,b(D.c)));
if(esAdm&&FUNC){t=t.replace('</body>','<script>window.RM_FUNC='+JSON.stringify(FUNC)+';window.RM_K='+JSON.stringify(k).replace(/</g,'\u003c')+';<\/script>'+PANEL+'</body>')}
